name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar o deploy manualmente pela aba Actions.
  workflow_dispatch:

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build estático
        # Sem BASE_PATH: o site é servido na raiz de dariotech.com.br
        # (o domínio próprio está em public/CNAME). Se um dia voltar a ser
        # publicado em dariotechltda.github.io/site-institucional/, basta
        # reintroduzir `env: BASE_PATH: /site-institucional` aqui.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
